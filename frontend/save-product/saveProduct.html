<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved Products · EasyDeal</title>
    <link rel="stylesheet" href="../shared/global.css" />
    <link rel="stylesheet" href="./saveProduct.css" />
  </head>
  <body>
    <main class="page">
      <div class="page-header">
        <h1 id="pageTitle">Saved Products</h1>
        <div class="page-header__controls">
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="Search Saved Products"
            aria-label="Search saved products"
          />
          <select
            id="sortSelect"
            class="sort-select"
            aria-label="Sort saved products"
          >
            <option value="recent">Sort by: Recently saved</option>
            <option value="price-asc">Sort by: Price (low to high)</option>
            <option value="price-desc">Sort by: Price (high to low)</option>
            <option value="title-asc">Sort by: Title (A–Z)</option>
          </select>
        </div>
      </div>

      <section id="savedSection">
        <div id="savedList" class="saved-list">
          <div class="skeleton saved-row"></div>
          <div class="skeleton saved-row"></div>
          <div class="skeleton saved-row"></div>
        </div>
      </section>

      <section id="recommendedSection">
        <div class="section-header">
          <h2>Recommended for you</h2>
          <a href="#" class="view-all" id="viewAllLink">View All</a>
        </div>
        <div id="recGrid" class="rec-grid">
          <div class="skeleton rec-tile"></div>
          <div class="skeleton rec-tile"></div>
          <div class="skeleton rec-tile"></div>
          <div class="skeleton rec-tile"></div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Icon templates (referenced via <use>) -->
    <svg width="0" height="0" style="position: absolute">
      <symbol
        id="icon-heart"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          d="M20.8 4.6c-1.9-1.9-5-1.9-6.9 0L12 5.5l-1.9-.9c-1.9-1.9-5-1.9-6.9 0-1.9 1.9-1.9 5 0 6.9L12 20.8l8.8-8.8c1.9-1.9 1.9-5 0-6.9z"
        />
      </symbol>
      <symbol id="icon-pin" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"
        />
      </symbol>
      <symbol id="icon-more" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="5" cy="12" r="2" />
        <circle cx="12" cy="12" r="2" />
        <circle cx="19" cy="12" r="2" />
      </symbol>
      <symbol
        id="icon-check"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M20 6 9 17l-5-5" />
      </symbol>
      <symbol id="icon-whatsapp" viewBox="0 0 24 24">
        <path
          d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.3c1.4.8 3.1 1.3 4.8 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.1c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3C4 14.7 3.6 13.3 3.6 12 3.6 7.4 7.4 3.6 12 3.6S20.4 7.4 20.4 12 16.6 20.1 12 20.1zm4.9-6.1c-.3-.1-1.6-.8-1.8-.9-.2-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.5.1-.3-.1-1.1-.4-2.1-1.3-.8-.7-1.3-1.6-1.4-1.8-.2-.3 0-.4.1-.6l.4-.4c.1-.1.2-.3.2-.4.1-.1.1-.3 0-.4-.1-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.4c.1.2 1.6 2.5 3.9 3.4.5.2 1 .4 1.3.5.5.2 1 .1 1.4.1.4-.1 1.3-.5 1.5-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.5-.3z"
        />
      </symbol>
    </svg>

    <script src="./saveProduct.js"></script>
  </body>
</html>
