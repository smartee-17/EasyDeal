<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyDeal — Buy & Sell Anything Instantly</title>

  <!-- Universal favicon, matching the Admin and Auth pages. -->
  <link rel="icon" type="image/svg+xml" href="../assets/images/logos/icon-light.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Shared toast styles. Reuses the existing notification system
         (shared/components/toast) rather than adding a Homepage-specific
         one; the tokens it reads are declared in homepage.css. -->
    <link rel="stylesheet" href="../shared/components/toast/toast.css" />
    <!-- The navbar and footer are JavaScript components in
         shared/components/, mounted by components.js into the empty
         mount points below. They bring their own styles. -->
    <link rel="stylesheet" href="../shared/components/navbar/navbar.css" />
    <link rel="stylesheet" href="../shared/components/footer/footer.css" />
    <link rel="stylesheet" href="homepage.css" />
  </head>
  <body>
    <!-- Navbar.
         The Homepage used to carry its own hand-written header: its own logo,
         its own search field and its own Login / Sign up / Log out buttons.
         That meant two different navbars shipped on the public site and the
         two drifted apart. It now mounts the same shared component the Saved
         Products and Product View pages use, so there is one navbar, one
         search implementation and one account dropdown.

         The shared header also resolves the session and owns logout. The
         Homepage still resolves the session itself, because it needs to know
         whether the visitor may save a product (the hearts are gated on it);
         see initSession() in homepage.js. -->
    <div data-component="header"></div>

    <section class="homepage-hero">
      <div class="homepage-hero-txt">
        <h1>Buy & Sell Anything Instantly</h1>
        <p>
          Discover great deals, list your products, and connect directly with
          buyers and sellers through WhatsApp.
        </p>
        <div class="hero-btns">
          <!-- Browsing stays public: the backend serves the product list
               to guests. Selling is gated and handled in homepage.js. -->
          <button class="browse" type="button">Browse Products</button>
          <button class="Sellitem" type="button">+ Sell an item</button>
        </div>
      </div>
      <div class="homepage-hero-imgs">
        <img class="h1" src="Assets/images/2.png" alt="" />
        <img class="h2" src="Assets/images/4.png" alt="" />
        <img class="h3" src="Assets/images/6.png" alt="" />
        <img class="h4" src="Assets/images/1.png" alt="" />
        <img class="h5" src="Assets/images/5.png" alt="" />
        <img class="h6" src="Assets/images/3.png" alt="" />
      </div>
    </section>
    <!-- The category rail is a real destination: the shared footer's
         "Categories" link points at it. -->
    <section class="homepage-categories" id="categories">
      <h2>Explore by Categories</h2>
      <div class="categories-scroll">
        <div class="categories-list"></div>
      </div>
      <button class="slide-arrow-btn slide-arrow-btn--left" id="slideLeftBtn"
        type="button" aria-label="Scroll categories left">
        <span data-icon="chevron-left" aria-hidden="true"></span>
      </button>
      <button class="slide-arrow-btn slide-arrow-btn--right" id="slideRightBtn"
        type="button" aria-label="Scroll categories right">
        <span data-icon="chevron-right" aria-hidden="true"></span>
      </button>
    </section>
    <section class="cards">
      <div class="exp explore">
        <h2 class="exp-text explore-text">Explore products</h2>
        <a href="#" class="view-all-link">View All</a>
        <div class="products"></div>
      </div>

      <div class="exp fresh">
        <h2 class="exp-text fresh-txt">Fresh Listings</h2>
        <a href="#" class="view-all-link">View All</a>
        <div class="products"></div>
      </div>

      <div class="exp trend">
        <h2 class="exp-text trend-txt">Trending products</h2>
        <a href="#" class="view-all-link">View All</a>
        <div class="products"></div>
      </div>
    </section>

    <!-- Footer.
         The Homepage used to carry its own hand-written copy, which meant
         two different footers shipped on the public site. It now mounts
         the same shared component every other page uses, so there is one
         footer and one set of link targets to maintain. -->
    <div data-component="footer"></div>
    <!-- Shared API base URL and fetch defaults. Loaded before the module
         below because homepage.js reads window.EasyDealAPI. -->
    <script src="../shared/config.js"></script>
    <script type="module" src="homepage.js"></script>
    <!-- Mounts the shared navbar and footer into the mount points above.
         Loaded as a module so it is deferred and the mount points are
         guaranteed to exist; components.js builds both components from
         JavaScript, so there is no fragment to fetch. -->
    <script type="module" src="../shared/components/components.js"></script>
  </body>
</html>
