<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/images/favicons/favicon-32.png"
    />
    <link rel="stylesheet" href="../../shared/global.css" />
    <link rel="stylesheet" href="../Shared/style.css" />
    <script defer src="./login.js" type="module"></script>
    <script defer src="../Shared/utils.js" type="module"></script>
    <title>Log In</title>
  </head>
  <body class="page">
    <main class="main">
      <section class="showcase">
        <div class="showcase__img">
          <img src="../../assets/images/login.png" alt="" />
        </div>
        <div class="showcase__description">
          <img
            src="../../assets/images/logos/icon-dark.svg"
            alt="Easy Deal Logo"
            class="showcase__description--logo"
          />
          <h2>
            Welcome to Easy<span class="showcase__description--highlight-dark"
              >Deal</span
            >
          </h2>
          <p>
            Find great deals, save products for later, and connect directly with
            sellers through WhatsApp.
          </p>
        </div>
      </section>

      <form class="form">
        <!-- <div class="logo" role="img" aria-label="Easy Deal Logo"></div> -->
        <div class="form__logo">
          <img
            class="form__logo__img"
            src="../../assets/images/logos/icon-light.svg"
            alt=""
          />
          <h2>
            Easy<span class="showcase__description--highlight-dark">Deal</span>
          </h2>
        </div>
        <section class="form__field">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            autofocus
            required
            class="form__email-input"
          />
        </section>
        <section class="form__field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
            class="form__password-input"
          />
          <a href="#" class="form__field-forget">Forgot password</a>
          <button
            type="button"
            class="form__toggle-password"
            aria-label="Hide password"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-eye-slash"
              viewBox="0 0 16 16"
            >
              <path
                d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"
              ></path>
              <path
                d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"
              ></path>
              <path
                d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"
              ></path>
            </svg>
          </button>
          <p class="form__error-msg" aria-live="polite"></p>
        </section>
        <section class="signin">
          <button class="signin__btn">Login</button>
          <p class="form__signup-link">
            Don't have an account? <a href="../Signup/signup.html">Sign Up</a>
          </p>
        </section>
        <section class="socials">
          <div class="socials__container">
            <a href="#" class="socials__link">
              <img src="../../assets/images/google.png" alt="" />
            </a>
            <a href="#" class="socials__link">
              <img src="../../assets/images/github.png" alt="" />
            </a>
            <a href="#" class="socials__link">
              <img src="../../assets/images/facebook.png" alt="" />
            </a>
          </div>
        </section>
      </form>
    </main>
  </body>
</html>
