<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../assets/images/favicons/favicon-32.png"
    />
    <link rel="stylesheet" href="../../shared/global.css" />
    <link rel="stylesheet" href="../Shared/style.css" />
    <script defer src="./signup.js" type="module"></script>
    <script defer src="../Shared/utils.js" type="module"></script>
    <title>Sign Up</title>
  </head>
  <body class="page">
    <main class="main">
      <!-- <div class="logo" role="img" aria-label="Easy Deal Logo"></div> -->
      <!-- <h1 class="title">Sign Up</h1> -->
      <section class="showcase">
        <div class="showcase__img">
          <img src="../../assets/images/login.png" alt="" />
        </div>
        <div class="showcase__description">
          <img
            src="../../assets/images/logos/icon-dark.svg"
            alt="Easy Deal Logo"
            class="showcase__description--logo"
          />
          <h2>
            Welcome to Easy<span class="showcase__description--highlight-dark"
              >Deal</span
            >
          </h2>
          <p>
            Find great deals, save products for later, and connect directly with
            sellers through WhatsApp.
          </p>
        </div>
      </section>
      <form class="form">
        <section class="form__field">
          <label for="name">Full name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Name"
            autocomplete="name"
            autofocus
            required
            class="form__name-input name"
          />
        </section>

        <section class="form__field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            autocomplete="email"
            required
            class="form__email-input email"
          />
        </section>

        <section class="form__field">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Phone Number"
            autocomplete="tel"
            required
            class="form__phone-input phone"
          />
        </section>

        <section class="form__field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
            class="form__password-input password"
          />
          <button
            type="button"
            class="form__toggle-password"
            aria-label="Show password as plain text. Warning: this will display your password on the screen."
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-eye"
              viewBox="0 0 16 16"
            >
              <path
                d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"
              />
              <path
                d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"
              />
            </svg>
          </button>
        </section>
        <section class="form__field">
          <label for="password">Account type</label>

          <div class="role-switch">
            <label class="role-option">
              <input type="radio" name="role" checked />
              <span>Buyer</span>
            </label>

            <label class="role-option">
              <input type="radio" name="role" />
              <span>Seller</span>
            </label>
          </div>
        </section>
        <section class="signup">
          <button class="signup__btn">Create account</button>
          <p class="form__signup-link">
            Already have an account? <a href="../Signup/signup.html">Log in</a>
          </p>
        </section>
      </form>
    </main>
  </body>
</html>
