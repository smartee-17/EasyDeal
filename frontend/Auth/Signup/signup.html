<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — EasyDeal</title>

  <!-- Universal favicon, matching the Homepage. The asset is an SVG, so
       the declared type is corrected to match rather than image/png. -->    <!-- Applies the stored theme before first paint, so a reload does not
         flash the default before the module loads. Mirrors the contract in
         shared/services/theme.js: the stored choice wins, the OS preference
         is only the fallback. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('easydeal-theme');
          var dark = stored === 'dark' || stored === 'light'
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/logos/icon-light.svg" />

  <!-- Load order is deliberate: Admin theme supplies the 4px-based spacing,
       typography, radius and shadow tokens; the universal colour system is
       then layered on top so the shared palette wins and is never
       duplicated in Auth CSS. -->
  <link rel="stylesheet" href="../../shared/theme.css" />
  <link rel="stylesheet" href="../../shared/global.css" />

  <link rel="stylesheet" href="../../shared/components/icons/icons.css" />

  <link rel="stylesheet" href="../Shared/style.css" />
</head>
<body class="auth-page">
<!-- Theme toggle, placed at the top of the page like the Login page. signup.js
     wires it through the shared theme module so it stays in step with the
     navbar and Login toggles. -->
<button
  type="button"
  class="auth-theme-toggle"
  data-theme-toggle
  aria-label="Switch to dark theme"
></button>
  <!-- The Auth pages deliberately do NOT mount the universal site header
       or footer. They are a focused, self-contained split-screen
       experience, and a site header would duplicate navigation and push
       the form below the fold on small screens. -->

  <main class="auth-page__main">
    <div class="auth-split">
      <!-- Identical hero treatment to Login, per the approved design. -->
      <section class="auth-hero" aria-labelledby="heroTitle">
        <img
          class="auth-hero__image"
          src="../../assets/images/image 71.png"
          alt=""
          aria-hidden="true"
          width="550"
          height="338"
        />

        <div class="auth-hero__brand">
          <span class="auth-hero__logo" aria-hidden="true"></span>
          <h2 class="auth-hero__title" id="heroTitle">
            Welcome to Easy<span class="auth-hero__title-accent">Deal</span>
          </h2>
          <p class="auth-hero__copy">
            Find great deals, save products for later, and connect directly
            with sellers through WhatsApp.
          </p>
        </div>
      </section>

      <section class="auth-form">
        <h1 class="auth-form__title">Create Your Account</h1>
        <p class="auth-form__subtitle">Join EasyDeal and start buying or selling</p>

        <form class="form" id="signupForm" novalidate>
          <div class="form-field">
            <label class="form-field__label" for="name">Full name</label>
            <input
              type="text"
              id="name"
              name="name"
              class="form-field__input"
              autocomplete="name"
              required
            />
            <p class="form-field__message form-field__error" id="name-error"></p>
          </div>

          <div class="form-field">
            <label class="form-field__label" for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-field__input"
              autocomplete="email"
              required
            />
            <p class="form-field__message form-field__error" id="email-error"></p>
          </div>

          <div class="form-field">
            <label class="form-field__label" for="phone">Phone number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              class="form-field__input"
              autocomplete="tel"
              required
            />
            <p class="form-field__message form-field__error" id="phone-error"></p>
          </div>

          <div class="form-field form-field--password">
            <label class="form-field__label" for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-field__input form-field__input--password"
              autocomplete="new-password"
              aria-describedby="password-hint"
              required
            />
            <button
              type="button"
              class="form-field__toggle"
              id="togglePassword"
              aria-label="Show password"
              aria-pressed="false"
            ></button>
            <p class="form-field__message form-field__hint" id="password-hint">
              At least 8 characters
            </p>
            <p class="form-field__message form-field__error" id="password-error"></p>
          </div>

          <!-- Buyer/Seller. Native radios behind the styling, so the choice
               is keyboard reachable, announced, and submitted as a real
               field. The backend maps Buyer -> 'user', Seller -> 'seller'.
               No Forgot password link here: that belongs on Login only. -->
          <fieldset class="form-field form-field--group">
            <legend class="form-field__label">Account type</legend>
            <div class="segmented">
              <input
                type="radio"
                id="accountTypeBuyer"
                name="accountType"
                value="user"
                class="segmented__input"
                checked
              />
              <label class="segmented__option" for="accountTypeBuyer">Buyer</label>

              <input
                type="radio"
                id="accountTypeSeller"
                name="accountType"
                value="seller"
                class="segmented__input"
              />
              <label class="segmented__option" for="accountTypeSeller">Seller</label>
            </div>
          </fieldset>

          <p class="form__alert" id="signupAlert" role="alert" hidden>
            <span class="form__alert-icon" id="signupAlertIcon" aria-hidden="true"></span>
            <span id="signupAlertMessage"></span>
          </p>

          <div class="form__actions">
            <button type="submit" class="form__submit" id="signupSubmit">Create account</button>
            <p class="form__link form__link--muted">
              Already have an account?
              <a class="form__link form__link-action" href="../Login/login.html">Log in</a>
            </p>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script type="module" src="./signup.js"></script>
</body>
</html>
