<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EasyDeal - Seller Profile</title>
  <!-- Universal favicon, matching the other frontend pages. Without it the
       browser falls back to requesting /favicon.ico and logs a 404. -->
  <link rel="icon" type="image/svg+xml" href="../assets/images/logos/icon-light.svg" />
  <link rel="stylesheet" href="sellerp.css" />
  <!-- The navbar and footer are the shared components, so they bring their
       own styles. This page mounts the same ones as the Homepage, Saved
       Products and Product View pages rather than a copy of either. -->
  <link rel="stylesheet" href="../shared/components/navbar/navbar.css" />
  <link rel="stylesheet" href="../shared/components/footer/footer.css" />
    <!-- Resolves the theme before first paint so a reload does not flash the
       default. Same contract as shared/services/theme.js: the stored choice
       wins, the OS preference is only the fallback. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('easydeal-theme');
        var dark = (stored === 'dark' || stored === 'light')
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script></head>
  <body>
    <!-- Universal navbar. Mounted outside .container so it spans the full
         viewport width; the seller-specific header below is the profile
         card and is not a site navbar. -->
    <div data-component="header"></div>

    <div class="container">
      <header class="profile-header">
        <div class="cover-image"></div>
        <div class="profile-details">
          <div class="avatar-wrapper">
            <img
              id="seller-avatar"
              src="Assets/images/missed-opportunity.jpg"
              alt="Seller Avatar"
            />
          </div>
          <div class="seller-info">
            <h1 class="seller-name" id="seller-name">
              Loading Seller...
              <span class="badge" id="verified-badge">
                <img
                  src="Assets/icons/correct-success-icon.svg"
                  class="badge-icon"
                  alt="Verified"
                />
                Verified Seller
              </span>
            </h1>
            <p class="seller-meta" id="seller-meta">
              <span class="star">★</span>
              <span id="seller-rating">0.0</span> &bull;
              <span id="seller-location">Addis Ababa, ET</span>
            </p>
          </div>
          <div class="header-actions">
            <button class="btn btn-secondary">Follow</button>
            <button class="btn btn-primary">Contact Seller</button>
          </div>
        </div>

        <div class="stats-bar">
          <div class="stat-item">
            <div class="stat-value" id="stat-sales">0</div>
            <div class="stat-label">Sales Completed</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="stat-count">0</div>
            <div class="stat-label">Active Items</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">&lt; 1 hr</div>
            <div class="stat-label">Response Time</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">2026</div>
            <div class="stat-label">Member Since</div>
          </div>
        </div>
      </header>

      <div class="main-grid">
        <aside class="sidebar">
          <div class="sidebar-card">
            <h3 class="card-title">Search Store</h3>
            <input
              type="text"
              id="seller-search"
              class="search-box"
              placeholder="Search this seller's items..."
            />

            <h3 class="card-title">Categories</h3>
            <ul class="categories-list" id="seller-categories"></ul>
          </div>
        </aside>

        <main class="content-area">
          <div class="tabs-nav">
            <button class="tab-btn active" data-tab="products">
              Products (<span id="product-count-badge">0</span>)
            </button>
            <button class="tab-btn" data-tab="reviews">Reviews</button>
          </div>

          <div class="products" id="seller-products">
            <p>Loading products...</p>
          </div>
        </main>
      </div>
    </div>

    <!-- Footer. Mounted outside .container so it spans the full viewport
         width, like on every other public page. -->
    <div data-component="footer"></div>

    <!-- Shared API base URL and fetch defaults, read by sellerp.js as
         window.EasyDealAPI. Loaded first because sellerp.js is a classic
         script and cannot import an ES module. -->
    <script src="../shared/config.js"></script>
    <script src="sellerp.js"></script>
    <!-- Mounts the shared navbar and footer into the mount points above. Loaded as a module so it is deferred and the mount points are guaranteed to exist; both components are built from JavaScript, so there is no fragment to fetch. -->
    <script type="module" src="../shared/components/components.js"></script>
  </body>
</html>
