<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Admin Login — EasyDeal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../global/index.css" />
  <link rel="stylesheet" href="../../components/index.css" />
  <link rel="stylesheet" href="./login.css" />

  <link rel="icon" type="image/png" sizes="32x32" href="../../../assets/images/logos/icon-light.svg">
</head>
<body>
  <div class="login-page">
    <button type="button" class="login-page__theme-btn navbar__theme-btn" aria-label="Toggle theme">
      <span class="icon--sun" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </span>
      <span class="icon--moon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </span>
    </button>

    <main class="login-page__main">
      <div class="login-card animate-fade-in-up">
        <div class="login-card__brand">
          <div class="login-card__logo" style="width:2.5rem;height:2.5rem;background:var(--color-primary);border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.25rem;">E</div>
          <h1 class="login-card__title">
            Easy<span class="login-card__title-accent">Deal</span>
          </h1>
        </div>

        <h2 class="login-card__heading">Admin Login</h2>
        <p class="login-card__subheading">Sign in to access the admin dashboard</p>

        <div class="login-card__alert alert alert--error hidden" id="loginAlert" role="alert" aria-live="polite">
          <span id="loginAlertMessage">Invalid credentials</span>
        </div>

        <form class="login-form" id="loginForm" novalidate>
          <div class="login-form__field">
            <label for="emailOrUsername" class="form-label">Email or Username</label>
            <input
              type="text"
              id="emailOrUsername"
              name="emailOrUsername"
              class="form-input"
              placeholder="Enter your email or username"
              autocomplete="username"
              required
            />
          </div>

          <div class="login-form__field">
            <label for="password" class="form-label">Password</label>
            <div class="login-form__password-wrap">
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="login-form__toggle-password"
                id="togglePassword"
                aria-label="Show password"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="login-form__options">
            <label class="login-form__checkbox-label">
              <input type="checkbox" name="rememberMe" id="rememberMe" class="login-form__checkbox" />
              <span>Remember me</span>
            </label>
          </div>

          <button type="submit" class="btn btn--primary btn--lg login-form__submit" id="loginSubmit">
            <span class="login-form__submit-text">Sign In</span>
            <span class="login-form__spinner hidden" id="loginSpinner" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon--spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            </span>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="./login.js"></script>
</body>
</html>
